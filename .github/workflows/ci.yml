# Format, lint, test and package the crate on its own, the way someone who
# clones this repository would.
#
# This repository mirrors packages/wuapi-sdk-rust of the wuapi monorepo (see
# RELEASING.md); the same checks run there before anything lands here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stable:
    name: Stable (fmt, clippy, test, package)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # This action has no major tags: the ref names the toolchain, like the
      # `channel = "stable"` of rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Package (dry run)
        run: cargo publish --dry-run

  msrv:
    name: MSRV (rust-version of Cargo.toml)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Read rust-version
        id: msrv
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # `+<version>` wins over rust-toolchain.toml, which names stable. The
      # library only: the tests' dependencies may need a newer compiler.
      - run: cargo "+${{ steps.msrv.outputs.version }}" check
